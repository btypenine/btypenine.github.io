    if (r.survived) Daily.add('survive');
    if (Ranking.best('bestKills', r.kills, 'night_kills')) this.newRec.push(t('newBest', { n: t('unitKill', { n: r.kills }) }));
    this.newRec.forEach((m, i) => floatText(W / 2, 640 - i * 56, m, '#e8590c', 40));
    persist();
  },
  update(dt) { this.t += dt; },
  buttons() {
    const b = [];
    if (!this.doubled && this.gold > 0 && AdBridge.canReward()) b.push({ x: 60, y: 905, w: 290, h: 100, label: t('dbl'), sub: t('dblS', { g: this.gold }), ad: true, color: '#7c4dff', size: 30,
      cb: () => AdBridge.rewarded(() => { if (this.doubled) return; this.doubled = true; save.gold += this.gold; persist(); floatText(W / 2, 760, t('goldN', { g: this.gold }), '#ffd43b', 50); }, 'double_gold') });
    if (!this.extra && AdBridge.canReward()) b.push({ x: 370, y: 905, w: 290, h: 100, label: t('moreChest'), sub: t('moreChestS'), ad: true, color: '#7c4dff', size: 28,
      cb: () => AdBridge.rewarded(() => { if (this.extra) return; this.extra = true; const g = genItem(this.r.day, 0); const s = addItem(g); this.loot.push(g); floatText(W / 2, 760, s ? t('autoSalv', { g: s }) : itemName(g), RAR_COL[g.rar], 40); }, 'extra_chest') });
    b.push({ x: 60, y: 1035, w: 220, h: 120, label: t('bag'), icon: 'bag', color: '#1971c2', size: 30, cb: () => openBag() });
    b.push({ x: 300, y: 1035, w: 360, h: 120, label: t('nextDay', { d: save.day }), color: '#ff8a3d', cb: () => AdBridge.interstitial(() => go('puzzle')) });
    return b;
  },
  draw() {
    const r = this.r;
    skyBg('#ffb36b', '#ffe8c2');
    const sy = 330 - Math.min(1, this.t) * 80;
    ctx.fillStyle = 'rgba(255,240,180,.6)'; ctx.beginPath(); ctx.arc(W / 2, sy, 140, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff1a8'; ctx.beginPath(); ctx.arc(W / 2, sy, 95, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8a25d'; ctx.fillRect(0, 300, W, 980);
    txt(r.survived ? t('dWin') : t('dLose'), W / 2, 130, 52, '#5a2d0c', 'center', '900', false, 680);
    txt(t('dRes', { d: r.day }), W / 2, 190, 30, '#7a4a20', 'center', '800');
    rr(60, 240, 600, 420, 30); ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    const rows = [
      [t('rKills'), t('rKv', { k: r.kills })],
      [t('rTime'), t('rTv', { s: r.time })],
      [t('rGold'), `${r.gold}`],
      [t('rBonus'), r.survived ? `+${this.bonus}` : t('none')],
      [t('rShop'), `+${this.pct}%`],
    ];
    rows.forEach((row, i) => { txt(row[0], 100, 290 + i * 54, 27, '#6c5843', 'left', '700', false, 330); txt(row[1], 620, 290 + i * 54, 27, '#3b2a1a', 'right', '800'); });
    if (!r.survived) txt(t('half'), 360, 290 + 5 * 50, 22, '#e03131', 'center', '700');
    ctx.fillStyle = '#e9d5bd'; ctx.fillRect(100, 575, 520, 3);
    txt(t('earned'), 100, 615, 32, '#3b2a1a', 'left', '900');
    txt(`${this.doubled ? this.gold * 2 : this.gold}`, 620, 615, 40, RES.gold.ink, 'right', '900');
    // 장비
    rr(60, 680, 600, 190, 26); ctx.fillStyle = 'rgba(40,30,20,.75)'; ctx.fill();
    txt(this.loot.length ? t('loot', { n: this.loot.length }) : t('noLoot'), 90, 712, 24, '#ffe8c2', 'left', '800');
    this.loot.slice(-5).forEach((it, i) => itemIcon(it, 125 + i * 118, 800, 96));
    for (const b of this.buttons()) button(b);
    drawFloats();
  },
  down(x, y) { tapButtons(this.buttons(), x, y); }
};

/* =========================================================
   입력 · 루프
   ========================================================= */
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - OX) / S, y: (e.clientY - r.top - OY) / S }; }
const blocked = () => AdBridge.active || needRotate();
function muteRect() { const p = (scene && scene.muteAt) || [660, 62]; return { x: p[0] - 34, y: p[1] - 34, w: 68, h: 68 }; }
function drawMute() {
  const r = muteRect(), cx = r.x + 34, cy = r.y + 34, m = Sound.muted();
  ctx.fillStyle = 'rgba(20,30,60,.65)'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(cx - 15, cy - 6); ctx.lineTo(cx - 8, cy - 6); ctx.lineTo(cx + 2, cy - 15); ctx.lineTo(cx + 2, cy + 15); ctx.lineTo(cx - 8, cy + 6); ctx.lineTo(cx - 15, cy + 6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  if (m) { line(cx + 8, cy - 7, cx + 20, cy + 7); line(cx + 20, cy - 7, cx + 8, cy + 7); }
  else { ctx.beginPath(); ctx.arc(cx + 3, cy, 9, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 3, cy, 16, -0.8, 0.8); ctx.stroke(); }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toLocal(e);
  Sound.userGesture = true; Sound.unlock();
  if (blocked() || !scene) return;
  if (popup) { handlePopup(p); return; }
  if (hit(muteRect(), p.x, p.y)) { Sound.toggle(); Sound.play('click'); return; }
  if (scene.down) scene.down(p.x, p.y, e.pointerId);
});
cv.addEventListener('pointermove', e => { if (blocked() || popup || !scene) return; const p = toLocal(e); if (scene.move) scene.move(p.x, p.y, e.pointerId); });
const endPtr = e => { if (!scene) return; const p = toLocal(e); if (scene.up) scene.up(p.x, p.y, e.pointerId); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
document.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { Sound.userGesture = true; Sound.unlock(); keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
function pauseNight() {
  if (scene === scenes.night && !scene.done && !popup) {
    scene.cancelInput();
    showPopup({ title: t('pause'), lines: [t('pauseB')], buttons: [{ label: t('resume'), color: '#5e35b1', cb: closePopup }] });
  }
}
function onPlatformPause() { keys.clear(); pauseNight(); }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  persist(true); keys.clear(); pauseNight();
});
// 게임 영역 바깥: 빈 여백 대신 장면에 맞는 배경
function drawOuter() {
  if (OX < 1 && OY < 1) return;
  const c = (scene && scene.outer) || ['#1b2350', '#0f1424'];
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  const s = 44 * Math.max(0.6, S * 1.4), types = ['wood', 'stone', 'gold'];
  for (let i = 0; i < 70; i++) {
    const x = hash2(i, 7) * VW, y = hash2(i, 13) * VH;
    if (x > OX - s && x < OX + W * S && y > OY - s && y < OY + H * S) continue;
    drawCell(x, y, s * (0.6 + hash2(i, 3) * 0.6), types[i % 3], 0.22);
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  if (OX >= 1) { ctx.fillRect(OX - 6, 0, 6, VH); ctx.fillRect(OX + W * S, 0, 6, VH); }
  if (OY >= 1) { ctx.fillRect(0, OY - 6, VW, 6); ctx.fillRect(0, OY + H * S, VW, 6); }
}
function drawRotate() {
  ctx.fillStyle = '#10142b'; ctx.fillRect(0, 0, VW, VH);
  const cx = VW / 2, cy = VH / 2 - 20, k = Math.min(VW, VH) / 400;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2 * (0.5 + 0.5 * Math.sin(performance.now() / 600)));
  rr(-30 * k, -52 * k, 60 * k, 104 * k, 10 * k); ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 5 * k; ctx.stroke();
  ctx.restore();
  txt(t('rotate'), cx, cy + 90 * k, 22 * k, '#fff', 'center', '800');
}
function drawToast() {
  if (!toast) return;
  const a = clamp(2.2 - toast.t, 0, 1); ctx.globalAlpha = a;
  ctx.font = `700 24px ${FONT}`; const w = ctx.measureText(toast.text).width + 48;
  rr(W / 2 - w / 2, 120, w, 52, 26); ctx.fillStyle = 'rgba(15,20,40,.85)'; ctx.fill();
  txt(toast.text, W / 2, 147, 24, '#fff', 'center', '700'); ctx.globalAlpha = 1;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    const halted = AdBridge.active || Platform.paused || needRotate();
    if (!halted && !popup && scene.update) scene.update(dt);
    if (!halted && !popup) updFloats(dt);
    if (toast) { toast.t += dt; if (toast.t > 2.2) toast = null; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    if (needRotate()) { drawRotate(); requestAnimationFrame(frame); return; }
    drawOuter();
    ctx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    scene.draw();
    drawMute();
    ctx.restore();
    if (popup) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = 'rgba(8,10,25,.62)'; ctx.fillRect(0, 0, VW, VH);
      ctx.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR); drawPopup();
    }
    drawToast();
    Sound.tick();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
async function boot() {
  await initBridge();
  save = await loadSaveAsync();
  Sound.init();
  document.documentElement.lang = save.lang;
  Install.init();
  go('title');
  bootRewards();
  Shop.init();
  requestAnimationFrame(frame);
  // 첫 화면이 실제로 그려지고 조작 가능해진 뒤 game_ready 전송
  requestAnimationFrame(() => requestAnimationFrame(() => { if (Platform.b) Platform.b.platform.sendMessage('game_ready').catch(() => {}); }));
}
boot();
</script>
